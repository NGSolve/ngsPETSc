name: Tag on version bump

# When a PR that changes the release version in pyproject.toml merges to main,
# this workflow creates the matching vX.Y.Z tag (if it does not already exist)
# and then calls the "Publish release" workflow to build, publish to PyPI and
# create the GitHub release.
#
# The release is invoked directly via `workflow_call` rather than by relying on
# the tag push: a tag pushed with the default GITHUB_TOKEN does NOT trigger
# other workflows, so calling it explicitly is what makes the release happen.
on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read release version from pyproject.toml
        id: ver
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          echo "Release version in pyproject.toml is $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if it does not already exist
        id: tag
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists -- nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
