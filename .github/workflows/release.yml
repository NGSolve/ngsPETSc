name: Publish release

# Reusable workflow. It is not triggered directly: the "Tag on version bump"
# workflow creates the release tag from a merged version bump and then calls
# this workflow (workflow_call) to build, publish to PyPI and create the
# GitHub release for that tag.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag (vX.Y.Z) to build and release.
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the tagged commit created by the caller.
          ref: ${{ inputs.ref }}
          # Full history and tags are required for poetry-dynamic-versioning
          # to derive the package version from the git tag.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi_publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release and upload dist files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref }}
        run: gh release create --title "$TAG" --generate-notes "$TAG" dist/*
