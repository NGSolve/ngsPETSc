[build-system]
requires = ["poetry-core>=2.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "ngsPETSc"
# Version is derived from the git tag at build time by poetry-dynamic-versioning.
# The placeholder below is only used for local checkouts without tags.
dynamic = ["version"]
description = "NGSolve/Netgen interface to PETSc"
authors = [
  { name = "Umberto Zerbinati", email = "umberto.zerbinati@maths.ox.ac.uk" },
  { name = "Patrick E. Farrell", email = "patrick.farrell@maths.ox.ac.uk" },
  { name = "Stefano Zampini", email = "stefano.zampini@kaust.edu.sa" },
  { name = "Jack Betteridge", email = "J.Betteridge@imperial.ac.uk" },
  { name = "Pablo D. Brubeck", email = "brubeck@protonmail.com"},
]
maintainers = [
  { name = "Umberto Zerbinati", email = "umberto.zerbinati@maths.ox.ac.uk" },
  { name = "Pablo D. Brubeck", email = "brubeck@protonmail.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "netgen-mesher >= 6.2.2603,<7.0",
  "petsc4py >=3.22,<4.0",
  "numpy >=2,<3",
  "scipy >=1,<2",
]

[project.urls]
Documentation = "https://ngspetsc.readthedocs.io/en/latest/"
Repository = "https://github.com/NGSolve/ngsPETSc"

[tool.poetry.extras]
firedrake = ["firedrake"]

[tool.poetry]
# ---------------------------------------------------------------------------
# RELEASE VERSION -- this is the single source of truth for releases.
# Bump this in a PR; when it merges to main the "Tag on version bump" workflow
# creates the matching git tag (vX.Y.Z), which triggers the PyPI release.
# At build time poetry-dynamic-versioning derives the actual package version
# from that git tag, so the wheel version and the tag can never disagree.
# ---------------------------------------------------------------------------
packages = [{ include = "ngsPETSc" }]
version = "0.2.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# When building from a checkout without any matching tag (e.g. a shallow clone
# or an untagged dev build), fall back to this version instead of failing.
# Keep it in step with [tool.poetry] version above.
fallback-version = "0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pylint = "^3.3"

[tool.poetry.group.ngsolve.dependencies]
ngsolve = "^6.2"
mpi4py = "^4"
